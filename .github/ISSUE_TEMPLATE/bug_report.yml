name: Bug report
description: Report a reproducible problem in Glyph.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please check existing issues first. Do not include secrets or private data."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Glyph..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Glyph version or commit
  - type: input
    id: os
    attributes:
      label: Operating system and version
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Remove personal information before attaching files.
